<h1>CoolRPG Web</h1>
<p>This folder contains the multiplayer browser build.</p>
<p>On the host PC, run <b>start_server.bat</b> or <code>node server.js</code>, then open <code>http://localhost:3000</code>.</p>
<p>For friends on the same Wi-Fi, share the host PC's local IP and port 3000.</p>
